# Direct career site registry for ApplyPilot
# Users can add their own sites following this pattern.
# Use {location_encoded} placeholder for location (URL-encoded).
# Use {query_encoded} placeholder for search terms (URL-encoded).

# ── Manual-Only ATS Domains ──────────────────────────────────────────────
# These ATS platforms have unsolvable CAPTCHAs. Jobs routing through them
# are flagged as "manual" during apply — bot skips, user applies by hand.
manual_ats:
  - "ibegin.tcsapps.com"       # TCS iBegin — unsolvable CAPTCHA every time

# ── Blocked sites — too problematic for automation ───────────────────────
blocked:
  sites:
    - "glassdoor"
    - "google"
    - "accenture"
    - "AccentureCareers"
    - "Workopolis"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"
    - "%accenture%"
    - "%workopolis.com/out%"

# ── Blocked SSO domains — the agent will NEVER type a password on these ──
# Security boundary, not a "skip entirely" list: if the browser's cloned
# profile is already authenticated (log into these once in your real
# Chrome), the agent reuses that session and clicks through an account
# picker/consent screen. It only refuses when a fresh login is required
# (unauthenticated), since typing Google/Microsoft/Okta credentials via
# automation gets flagged as suspicious and can trip account security.
blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"
  - "sso.cisco.com"

# ── Known shared ATS login domains ────────────────────────────────────────
# Same reasoning as blocked_sso: these are shared platforms used by many
# different employers. Create ONE account on each (in your real Chrome,
# manually, once) and the cloned worker profile reuses that session for
# every company that happens to use the same platform -- no bot-driven
# signup needed. If not yet authenticated, the agent fails that job
# gracefully rather than attempting to sign up with a generated identity.
known_ats_domains:
  - "greenhouse.io"
  - "lever.co"
  - "myworkdayjobs.com"
  - "myworkday.com"
  - "smartrecruiters.com"
  - "jobs.ashbyhq.com"
  - "icims.com"
  - "taleo.net"
  - "successfactors.com"
  - "bamboohr.com"

# ── Base URLs for URL resolution ─────────────────────────────────────────
# Used by detail enrichment to resolve relative URLs scraped from sites.
# Sites not listed here (or with null) cannot have relative URLs resolved.
base_urls: {}

# ── Direct career sites (discovery stage 1c) ──────────────────────────────
# The original template's 30 entries here were all hardcoded to
# software-engineer/developer role URLs (e.g. "/remote-dev-jobs",
# "/role/l/software-engineer/canada") and mostly Canada/US-hosted -- wrong
# job category and wrong region for a Switzerland-based, non-engineering
# search, so every one of them was guaranteed to return zero usable matches.
# Removed rather than reworked: unlike employers.yaml's Workday portals,
# there's no direct Swiss equivalent of "generic English-language remote-dev
# job boards" worth curating, and discovery already runs through JobSpy
# (Indeed, LinkedIn, Glassdoor, ZipRecruiter, Google Jobs) and the 8 Swiss
# Workday employer portals in employers.yaml. Add your own entries here
# following the pattern below if you want additional direct-site scraping.
sites: []
