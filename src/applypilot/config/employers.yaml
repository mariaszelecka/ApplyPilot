# Workday employer registry for ApplyPilot
# Users can add their own employers by following this pattern.
# Find your employer's Workday URL at: https://[company].wd[N].myworkdayjobs.com
#
# This list is Swiss/DACH-focused to match a Switzerland-only job search
# (see scoring/region_quota.py). Each entry below was verified live against
# its Workday CXS API before being added -- it returns real postings, not
# just a guessed tenant/site_id. Swap in your own region's employers if
# you're running this somewhere else; region_quota.py is what actually
# narrows results down to your target locations, so this list only needs
# to be "companies worth scraping," not location-exact.

employers:

  # ── Swiss / DACH employers ────────────────────────────────────────────

  swisscom:
    name: "Swisscom"
    tenant: "swisscom"
    site_id: "SwisscomExternalCareers"
